services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - ${NGINX_PORT_HTTP}:80
      - ${NGINX_PORT_HTTPS}:443
      - ${NGINX_PORT_ADMIN}:81
    volumes:
      - ${DOCKER_ROOT}/npm/data:/data
      - ${DOCKER_ROOT}/npm/letsencrypt:/etc/letsencrypt
