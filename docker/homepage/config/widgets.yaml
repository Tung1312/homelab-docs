---
# For configuration options and examples, please see:
# https://gethomepage.dev/latest/configs/service-widgets

- resources:
    label: System
    cpu: true
    memory: true
#    disk:
#      - /

- resources:
    label: Storage
    expanded: true
    disk:
      - /mnt/Storage

- resources:
    label: Backup
    expanded: true
    disk:
      - /mnt/Backup

- resources:
    label: Monitor
    cputemp: true
    uptime: true

- datetime:
    text_size: xl
    format:
      timeStyle: short

- openmeteo:
    label:
    latitude:
    longitude:
    units: metric
    cache: 5 # Time in minutes to cache API responses, to stay within limits
    format: # optional, Intl.NumberFormat options
      maximumFractionDigits: 1
