# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

title: My Awesome Homepage
favicon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/homehub.svg

headerStyle: boxed #Widgets
hideVersion: true
disableUpdateCheck: true
useEqualHeights: false
disableCollapse: true
showStats: true

theme: dark
color: slate

background:
#  image: https://images.unsplash.com/photo-1618005479492-bc36dc8aeaf2?q=80&w=2671&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D
#  image: https://images.unsplash.com/photo-1632307941173-5d541ea1d940?q=80&w=1792&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D
  image: https://images.unsplash.com/photo-1454105511235-eda89ad84214?q=80&w=1752&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D
  blur: xs
  brightness: 50
  opacity: 75

providers:
  openweathermap: openweathermapapikey
  weatherapi: weatherapiapikey

font:
  sans: "Rubik"
  mono: "JetBrains Mono"

layout:
  Group Main:
    tab: Home
    header: false
    style: row
    columns: 3
    Network:
      icon: mdi-speedometer.svg
      Group Net:
        header: false
        style: row
        columns: 2
      Group C:
        header: false
        style: row
        columns: 2
    System:
      icon: mdi-server-network.svg
      style: row
      columns: 1
      Group A:
        header: false
        style: row
        columns: 2
    Applications:
      icon: mdi-application.svg
      Group Jelly 1:
        header: false
        style: row
        columns: 2
  Media Automation:
    tab: Media
    header: false
    Group MA 2:
      header: false
      style: row
      columns: 3
    Group MA 1:
      header: false
      style: row
      columns: 4
    Group MA 3:
      header: false
      style: row
      columns: 2
      MA Sub 1:
        header: false
        style: row
        columns: 1
      MA Sub 2:
        header: false
        style: row
        columns: 1
