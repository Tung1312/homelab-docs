# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

title: Trantung Home
description: Homelab dashboard

favicon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/homehub.svg

headerStyle: clean
hideVersion: true
disableUpdateCheck: true
useEqualHeights: true
disableCollapse: true
showStats: true

theme: dark
color: slate
iconStyle: theme

background:
  image: https://images.unsplash.com/photo-1692520883599-d543cfe6d43d?q=80&w=2533&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D
  blur: lg
  brightness: 50
  opacity: 75

providers:
  openweathermap: openweathermapapikey
  weatherapi: weatherapiapikey

layout:
  Server Stats:
    style: row
    columns: 1
    icon: mdi-chart-line
    Stats Row 1:
      header: false
      style: row
      columns: 3
    Stats Row 2:
      header: false
      style: row
      columns: 4
  Infrastructure:
    style: row
    columns: 1
    icon: mdi-server-network
    Infra Row 1:
      header: false
      style: row
      columns: 4
    Infra Row 2:
      header: false
      style: row
      columns: 3
  Applications:
    style: row
    columns: 1
    icon: mdi-apps
    Apps Row 1:
      header: false
      style: row
      columns: 4
    Apps Row 2:
      header: false
      style: row
      columns: 3
  Media:
    style: row
    columns: 1
    icon: mdi-play-circle
    Media Row 1:
      header: false
      style: row
      columns: 3
    Media Row 2:
      header: false
      style: row
      columns: 4
  Media Widgets:
    style: row
    columns: 2
    header: false
    Schedule:
      header: false
      style: row
      columns: 1
    Live:
      header: false
      style: row
      columns: 1
  Quick Links:
    style: row
    columns: 3
    icon: mdi-link-variant
