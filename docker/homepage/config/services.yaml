# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

# ---------------------------------------------------------------------------
# SERVER STATS  (live graphs from Glances)
# ---------------------------------------------------------------------------
- Server Stats:
    - Stats Row 1:
        - CPU:
            icon: mdi-cpu-64-bit
            widget:
              type: glances
              url:
              version: 4
              metric: cpu
        - RAM:
            icon: mdi-memory
            widget:
              type: glances
              url:
              version: 4
              metric: memory
        - Temp:
            icon: mdi-thermometer
            widget:
              type: glances
              url:
              version: 4
              metric: "sensor:Package id 0"
    - Stats Row 2:
        - Network:
            icon: mdi-lan
            widget:
              type: glances
              url:
              version: 4
              metric: network:enp2s0
        - Disk I/O:
            icon: mdi-swap-vertical
            widget:
              type: glances
              url:
              version: 4
              metric: disk:sdb
        - Storage:
            icon: mdi-harddisk
            widget:
              type: glances
              url:
              version: 4
              metric: fs:/mnt/Storage
        - Backup:
            icon: mdi-backup-restore
            widget:
              type: glances
              url:
              version: 4
              metric: fs:/mnt/Backup

# ---------------------------------------------------------------------------
# INFRASTRUCTURE
# ---------------------------------------------------------------------------
- Infrastructure:
    - Infra Row 1:
        - Portainer:
            icon: portainer-alt.png
            href:
            description: Docker manager
            siteMonitor:
            statusStyle: dot
            widget:
              type: portainer
              fields: ["running", "stopped"]
              url:
              env: 3
              key:
        - Nginx:
            icon: nginx-proxy-manager.png
            href:
            description: Reverse proxy
            widget:
              type: npm
              fields: ["enabled", "disabled"]
              url:
              username:
              password:
        - AdGuard Home:
            icon: adguard-home.png
            href:
            description: DNS & adblock
            widget:
              type: adguard
              fields: ["queries", "blocked", "latency"]
              url:
              username:
              password:
        - Cloudflared:
            icon: cloudflare.png
            href:
            description: Cloudflare tunnel
            ping: 1.1.1.1
            widget:
              type: cloudflared
              fields: ["status"]
              accountid:
              tunnelid:
              key:
    - Infra Row 2:
        - Beszel:
            icon: beszel.png
            href:
            description: System monitor
        - Uptime Kuma:
            icon: uptime-kuma.png
            href:
            description: Uptime monitor
        - Tailscale:
            icon: tailscale.png
            href:
            description: Mesh VPN

# ---------------------------------------------------------------------------
# APPLICATIONS
# ---------------------------------------------------------------------------
- Applications:
    - Apps Row 1:
        - Jellyfin:
            icon: jellyfin.png
            href:
            description: Media server
            siteMonitor:
            statusStyle: dot
            widget:
              type: jellyfin
              fields: ["movies", "series", "episodes"]
              url:
              key:
              version: 2
              enableBlocks: true
              enableNowPlaying: false
              enableUser: false
              enableMediaControl: false
              showEpisodeNumber: true
              expandOneStreamToTwoRows: false
        - Seerr:
            icon: seerr.png
            href:
            description: Media requests
            siteMonitor:
            statusStyle: dot
            widget:
              type: seerr
              url:
              key:
              fields: ["pending", "approved", "available"]
        - Immich:
            icon: immich.png
            href:
            description: Photos & videos
            siteMonitor:
            statusStyle: dot
            widget:
              type: immich
              fields: ["photos", "videos", "storage"]
              url:
              key:
              version: 2
        - Nextcloud:
            icon: nextcloud.png
            href:
            description: Cloud storage
            siteMonitor:
            statusStyle: dot
            widget:
              type: nextcloud
              fields: ["cpuload", "memoryusage", "numfiles"]
              url:
              username:
              password:
    - Apps Row 2:
        - Vaultwarden:
            icon: vaultwarden.png
            href:
            description: Password vault
        - File Browser:
            icon: filebrowser.png
            href:
            description: File manager
        - Crafty:
            icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/crafty-controller.png
            href:
            description: Minecraft server

