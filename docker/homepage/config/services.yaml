# ---------------------------------------------------------------------------
# MEDIA WIDGETS
# ---------------------------------------------------------------------------
- Media Widgets:
    - Schedule:
        - Calendar:
            icon: mdi-calendar-month-outline
            widget:
              type: calendar
              view: monthly
              maxEvents: 10
              showTime: true
              integrations:
                - type: sonarr
                  service_group: Media Row 1
                  service_name: Sonarr
                - type: radarr
                  service_group: Media Row 1
                  service_name: Radarr
    - Live:
        - Now Playing:
            icon: mdi-radio-tower
            widget:
              type: jellyfin
              url:
              key:
              version: 2
              enableBlocks: false
              enableNowPlaying: true
              enableUser: true
              enableMediaControl: false
              showEpisodeNumber: true
              expandOneStreamToTwoRows: false
        - Downloading:
            icon: mdi-download-circle-outline
            widget:
              type: qbittorrent
              fields: []
              url:
              username:
              password:
              enableLeechProgress: true
              enableLeechSize: true
