services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    network_mode: host
    group_add:
      - "987"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
      - LIBVA_DRIVER_NAME=i965
    volumes:
      - ${DOCKER_ROOT}/jellyfin:/config
      - ${STORAGE_MOUNT}/media:/data/media
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
