services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    volumes:
      - ${DOCKER_ROOT}/sonarr:/config
      - ${STORAGE_MOUNT}:/data
    ports:
      - ${SONARR_PORT_WEB}:8989
    restart: unless-stopped
