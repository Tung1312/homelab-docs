services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    volumes:
      - ${DOCKER_ROOT}/bazarr:/config
      - ${STORAGE_MOUNT}/media:/data/media
    ports:
      - ${BAZARR_PORT_WEB}:6767
    restart: unless-stopped
