services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    volumes:
      - ${DOCKER_ROOT}/radarr:/config
      - ${STORAGE_MOUNT}:/data
    ports:
      - ${RADARR_PORT_WEB}:7878
    restart: unless-stopped
