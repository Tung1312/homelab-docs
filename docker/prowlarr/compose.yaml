services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    dns:
      - 1.1.1.1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    volumes:
      - ${DOCKER_ROOT}/prowlarr:/config
    ports:
      - ${PROWLARR_PORT_WEB}:9696
    restart: unless-stopped
