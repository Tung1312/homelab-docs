services:
  speedtest-tracker:
    container_name: speedtest-tracker
    image: lscr.io/linuxserver/speedtest-tracker:latest
    restart: unless-stopped
    ports:
      - 8765:80
      - 8444:443
    environment:
      - PUID=1000
      - PGID=1000
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=0 0 * * * # Chạy 1 ngày 1 lần
      - CHART_DATETIME_FORMAT=H:i d/m/Y
      - APP_KEY=base64:${SPEEDTEST_KEY}
      - APP_URL=http://100.127.114.11:8765
    volumes:
      - ${DOCKER_ROOT}/speedtest-tracker:/config
