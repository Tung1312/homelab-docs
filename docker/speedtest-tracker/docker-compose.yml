services:
  speedtest-tracker:
    container_name: speedtest-tracker
    image: lscr.io/linuxserver/speedtest-tracker:latest
    restart: unless-stopped
    ports:
      - "${SPEEDTEST_PORT_WEB}:80"
      - "${SPEEDTEST_PORT_HTTPS}:443"
    environment:
      - PUID=1000
      - PGID=1000
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=0 0 * * *
      - CHART_DATETIME_FORMAT=H:i d/m/Y
      - APP_KEY=base64:${SPEEDTEST_KEY}
      - APP_URL=${SPEEDTEST_APP_URL}
    volumes:
      - ${DOCKER_ROOT}/speedtest-tracker:/config
